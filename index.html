<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DevTech Academy - Sistema de Alunos</title>
</head>
<body>
  <h2>Cadastro de Alunos</h2>

  <form id="formAluno">
    <label>Nome:</label>
    <input type="text" id="nome" required><br>

    <label>Idade:</label>
    <input type="number" id="idade" required><br>

    <label>Curso:</label>
    <select id="curso">
      <option>JavaScript</option>
      <option>Python</option>
      <option>Java</option>
    </select><br>

    <label>Nota Final:</label>
    <input type="number" id="notaFinal" step="0.1" required><br>

    <button type="submit">Cadastrar</button>
  </form>

  <h3>Lista de Alunos</h3>
  <table border="1" id="tabelaAlunos">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Curso</th>
        <th>Nota</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>Relatórios</h3>
  <button onclick="listarAprovados()">Aprovados</button>
  <button onclick="mediaNotas()">Média das Notas</button>
  <button onclick="mediaIdades()">Média das Idades</button>
  <button onclick="ordenarNomes()">Ordem Alfabética</button>
  <button onclick="contarPorCurso()">Qtd por Curso</button>

  <div id="relatorio"></div>

  <script src="script.js"></script>
</body>
</html>
